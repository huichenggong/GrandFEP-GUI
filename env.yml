name: gfep_gui_dev
channels:
  - conda-forge
dependencies:
  - python=3
  - pip
  - numpy
  - scipy
  - pandas
  - openmm
  - openmmtools
  - pymbar
  - openmpi=4.1
  - mpi4py
  - cuda-version=12
  - mdtraj
  - mdanalysis
  # additional packages
  - ipykernel
  - ipywidgets
  - ambertools
  - matplotlib
  - pytest-mpi
  - ghp-import
  - rdkit
  - nodejs          # required for context7 MCP server (Claude Code)
  - pip:
      - sphinx
      - sphinx-autodoc-typehints
      - sphinx-mdinclude
      - myst-parser